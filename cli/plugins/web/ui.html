<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6fb" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#0b111b" media="(prefers-color-scheme:dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>vivary</title>
<link rel="stylesheet" href="/assets/app.css">

<div class="topbar">
  <h1>vivary</h1>
  <div class="top-actions">
    <div id="host">connecting…</div>
    <button id="logout" class="ghost" hidden>Sign out</button>
  </div>
</div>

<!-- Shown until there is a session: wrong address, not set up, enroll, login. -->
<section id="gate" class="gate" hidden></section>

<main id="app" hidden>
  <p id="fleet">Loading sandboxes…</p>
  <div id="list"></div>

  <section>
    <div class="sec-head"><h2>Devices</h2><button id="refresh" class="ghost">Refresh</button></div>
    <div id="devs"></div>
    <form id="enrol">
      <input id="dname" placeholder="device name — ipad, phone" autocapitalize="off" autocorrect="off" spellcheck="false">
      <textarea id="dkey" placeholder="ssh-ed25519 AAAA… paste this device's PUBLIC key" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
      <button type="submit">Enrol device</button>
    </form>
  </section>

  <section>
    <div class="sec-head"><h2>Passkeys</h2></div>
    <div id="pks"></div>
    <div class="row-actions">
      <button id="pk-add" class="ghost">Add a passkey on this device</button>
      <button id="logout-all" class="ghost">Sign out everywhere</button>
    </div>
  </section>
</main>

<div id="toast"></div>
<script type="module" src="/assets/app.js"></script>
