# Sandbox sshd policy: key-only auth for the agent user.
# Used by Claude Desktop's "Add SSH connection" (Code tab).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers agent

# Non-interactive ssh exec sessions don't source profile files, so provide
# the sandbox environment here (OpenSSH >= 8.7).
# Force a UTF-8 locale (SetEnv overrides any LANG/LC_* the client forwards —
# a client whose locale isn't generated here would otherwise fall back to C
# and mangle box-drawing/accented output).
SetEnv LANG=C.UTF-8 LC_ALL=C.UTF-8 CLAUDE_CONFIG_DIR=/home/agent/.claude PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers DISPLAY=:99 HISTFILE=/home/agent/.config/bash_history PATH=/home/agent/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
