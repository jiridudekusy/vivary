<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b111b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Screen — vivary</title>
<link rel="stylesheet" href="/assets/vnc.css">

<header id="bar">
  <a id="back" href="/" aria-label="Back to vivary">&lsaquo;</a>
  <div id="title"><b id="name"></b><span id="status">Connecting…</span></div>
  <div id="tools">
    <button id="kbd" hidden>Keyboard</button>
    <button id="esc" title="Escape">Esc</button>
    <button id="tab" title="Tab">Tab</button>
    <button id="ctrl" title="Hold Ctrl until pressed again" aria-pressed="false">Ctrl</button>
    <button id="text">Text</button>
    <button id="full" hidden>Full screen</button>
    <button id="again" class="primary" hidden>Reconnect</button>
  </div>
</header>

<main id="screen"></main>
<div id="msg" hidden></div>

<!-- Focused to bring up a phone's on-screen keyboard; what is typed into it is
     sent as keys and never kept. -->
<textarea id="kbd-input" aria-label="Keyboard input for the sandbox" autocapitalize="off"
  autocomplete="off" autocorrect="off" spellcheck="false"></textarea>

<dialog id="text-dlg">
  <h2>Text for the sandbox</h2>
  <textarea id="text-in" rows="4" placeholder="Paste or write here" autocapitalize="off"
    autocorrect="off" spellcheck="false"></textarea>
  <div class="row">
    <button id="type-it" class="primary">Type it</button>
    <button id="clip-it">Put on its clipboard</button>
    <button id="text-close">Close</button>
  </div>
  <div id="from-sbx" hidden>
    <p>The sandbox copied text.</p>
    <button id="copy-sbx">Copy it here</button>
  </div>
</dialog>

<script type="module" src="/assets/vnc.js"></script>
