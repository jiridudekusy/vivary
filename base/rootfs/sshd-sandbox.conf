# Sandbox sshd policy: key-only auth for the agent user.
# Used by Claude Desktop's "Add SSH connection" (Code tab).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers agent

# Non-interactive ssh exec sessions don't source profile files, so provide
# the sandbox environment here (OpenSSH >= 8.7).
SetEnv CLAUDE_CONFIG_DIR=/home/agent/.claude PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers DISPLAY=:99 HISTFILE=/home/agent/.config/bash_history PATH=/home/agent/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
